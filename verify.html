<div class="glass-card" style="max-width: 600px; margin: 100px auto;">
    <h2>Verify Certificate</h2>
    <div class="form-group">
        <input type="text" id="certIdInput" placeholder="Enter Certificate ID (e.g., CERT-X7Y8Z)">
    </div>
    <button onclick="verifyCert()" class="btn btn-primary">Verify Now</button>

    <div id="result" style="margin-top: 2rem; display: none;" class="glass-card">
        <!-- Result will be shown here -->
    </div>
</div>

<script type="module">
    import { db } from './js/firebase.js';
    import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    window.verifyCert = async () => {
        const id = document.getElementById('certIdInput').value;
        const resultDiv = document.getElementById('result');
        
        const q = query(collection(db, "certificates"), where("certificateId", "==", id));
        const querySnapshot = await getDocs(q);

        resultDiv.style.display = 'block';
        if (!querySnapshot.empty) {
            const data = querySnapshot.docs[0].data();
            resultDiv.innerHTML = `
                <h3 style="color: #4ade80;"><i class="fas fa-check-circle"></i> Verified Certificate</h3>
                <p><strong>Student:</strong> ${data.studentName}</p>
                <p><strong>Course:</strong> ${data.course}</p>
                <p><strong>Date:</strong> ${data.issueDate}</p>
            `;
        } else {
            resultDiv.innerHTML = `<h3 style="color: #f87171;"><i class="fas fa-times-circle"></i> Invalid Certificate ID</h3>`;
        }
    };
</script>
